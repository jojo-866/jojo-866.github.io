    <meta name="theme-color" content="#EAF6FF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1C1B2D" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">

    <!-- TODO(personalize): replace YOUR_DOMAIN. og:image should be a 1200x630 image you made. -->
    <link rel="canonical" href="https://YOUR_DOMAIN/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Jyotsana Regmi · Software Developer">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Jyotsana Regmi · Software Developer">

          content="Calm, careful software. Projects, skills and contact.">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <link rel="manifest" href="manifest.json">

    <style>
        html, body { margin: 0; height: 100%; background: #EAF6FF; }
        #splash {
          position: fixed; inset: 0; z-index: 10;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
          background: linear-gradient(180deg, #CAE6F7 0%, #EAF6FF 50%, #FFFFFF 100%);
          font-family: Georgia, 'Times New Roman', serif; color: #0F2A40;
          transition: opacity .8s cubic-bezier(.215,.61,.355,1);
        }
        #splash.done { opacity: 0; pointer-events: none; }
        #splash .orb {
          width: 56px; height: 56px; border-radius: 50%;
          background: linear-gradient(135deg, #69B7E8, #FFFFFF, #2F78B7);
          box-shadow: 0 0 48px rgba(105,183,232,.55);
          animation: breathe 3.2s ease-in-out infinite;
        }
        #splash .name { font-size: 22px; letter-spacing: .04em; }
        @keyframes breathe { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.12); opacity: 1; } }
        @media (prefers-color-scheme: dark) {
          html, body { background: #1C1B2D; }
          #splash { background: linear-gradient(180deg, #14233F 0%, #1C1B2D 50%, #15142A 100%); color: #F1F6FB; }
          #splash .orb { box-shadow: 0 0 56px rgba(105,183,232,.5); }
        }
        @media (prefers-reduced-motion: reduce) {
          #splash .orb { animation: none; }
          #splash { transition: none; }
        }
        .sr-only {
          position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
          overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }
    </style>
</head>
<body>
<div id="splash" role="status" aria-label="Loading">
    <div class="orb"></div>
    <div class="name">Jyotsana Regmi</div>
</div>

<!-- Plain-text summary for crawlers and link previews. -->
<div class="sr-only">
    <h1>Jyotsana Regmi, Software Developer</h1>
    <p>Portfolio with selected projects, skills, background and contact details.</p>
    <noscript>This site needs JavaScript to run.</noscript>
</div>

<script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 900);
    });
</script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
